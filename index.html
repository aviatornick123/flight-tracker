<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Flight Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Top Bar Header -->
    <header class="header">
      <div class="header-left">
        <span class="status-dot"></span>
        <span class="radar-label">RADAR ACTIVE — 15 MILE RADIUS</span>
      </div>
      <div class="header-right">
        <span id="current-time">00:00:00</span>
      </div>
    </header>

    <!-- Flight Grid Container -->
    <main id="flight-grid" class="flight-grid">
      <!-- Flight cards will be dynamically injected here by JavaScript -->
      <div class="loading-state">Scanning airspace...</div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
